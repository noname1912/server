<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Music Player — Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #0f3460;
    }
    header h1 { font-size: 1.5rem; color: #e94560; }
    header span { color: #888; font-size: 0.9rem; }
    .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed #0f3460;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #1a1a2e;
      margin-bottom: 30px;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: #e94560; background: #16213e; }
    .upload-zone .icon { font-size: 3rem; margin-bottom: 10px; }
    .upload-zone p { color: #888; margin-top: 8px; font-size: 0.9rem; }
    #fileInput { display: none; }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: #c73652; }
    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }
    .btn-danger { background: #c0392b; }
    .btn-danger:hover { background: #a93226; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 12px 20px;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .stat .val { font-size: 1.8rem; font-weight: bold; color: #e94560; }
    .stat .lbl { font-size: 0.8rem; color: #888; margin-top: 4px; }

    /* Song list */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .song-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .song-item {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s;
    }
    .song-item:hover { border-color: #e94560; }
    .song-cover {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: #0f3460;
      flex-shrink: 0;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-meta { font-size: 0.82rem; color: #888; margin-top: 3px; }
    .song-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .duration { font-size: 0.85rem; color: #aaa; min-width: 40px; text-align: right; }

    /* Upload progress */
    .progress-bar {
      height: 4px;
      background: #0f3460;
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }
    .progress-fill {
      height: 100%;
      background: #e94560;
      width: 0%;
      transition: width 0.3s;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1a2e;
      border: 1px solid #e94560;
      border-radius: 8px;
      padding: 12px 20px;
      color: #e0e0e0;
      font-size: 0.9rem;
      display: none;
      z-index: 999;
    }
    .ip-info {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.88rem;
      color: #aaa;
    }
    .ip-info code { background: #0f3460; padding: 2px 6px; border-radius: 4px; color: #e94560; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <span style="font-size:2rem">🎵</span>
    <div>
      <h1>ESP32 Music Player</h1>
      <span>Server quản lý nhạc</span>
    </div>
  </header>

  <div class="container">
    <div class="ip-info" id="ipInfo">
      📡 Địa chỉ server: <code id="serverIp">Đang lấy...</code>
      — Nhập địa chỉ này vào <code>SERVER_IP</code> trong <code>config.h</code> của ESP32
    </div>

    <!-- Upload -->
    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📂</div>
      <p><strong>Kéo thả file MP3/WAV vào đây</strong></p>
      <p style="margin-top:12px"><button class="btn" onclick="event.stopPropagation();document.getElementById('fileInput').click()">Chọn file</button></p>
      <p style="margin-top:10px">Hỗ trợ: MP3, WAV</p>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <input type="file" id="fileInput" multiple accept=".mp3,.wav" />

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat"><div class="val" id="totalSongs">0</div><div class="lbl">Bài hát</div></div>
      <div class="stat"><div class="val" id="totalDuration">0:00</div><div class="lbl">Tổng thời gian</div></div>
      <div class="stat"><div class="val" id="totalSize">0 MB</div><div class="lbl">Dung lượng</div></div>
    </div>

    <!-- Song list -->
    <div class="section-title">🎶 Thư viện nhạc</div>
    <ul class="song-list" id="songList">
      <li style="text-align:center;padding:30px;color:#666">Đang tải...</li>
    </ul>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let songs = [];

    function fmtDuration(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${String(sec).padStart(2, '0')}`;
    }
    function fmtSize(b) {
      if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
      return (b / 1024).toFixed(0) + ' KB';
    }
    function showToast(msg, isErr = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = isErr ? '#c0392b' : '#e94560';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function loadSongs() {
      try {
        const res = await fetch('/api/songs');
        songs = await res.json();
        renderSongs();
        updateStats();
      } catch (e) {
        showToast('Lỗi tải danh sách nhạc', true);
      }
    }

    function updateStats() {
      document.getElementById('totalSongs').textContent = songs.length;
      const totalSec = songs.reduce((a, s) => a + s.duration, 0);
      const totalBytes = songs.reduce((a, s) => a + s.size, 0);
      document.getElementById('totalDuration').textContent = fmtDuration(totalSec);
      document.getElementById('totalSize').textContent = fmtSize(totalBytes);
    }

    function renderSongs() {
      const ul = document.getElementById('songList');
      if (songs.length === 0) {
        ul.innerHTML = '<li style="text-align:center;padding:30px;color:#666">Chưa có bài hát nào. Upload MP3/WAV để bắt đầu!</li>';
        return;
      }
      ul.innerHTML = songs.map((s, i) => `
        <li class="song-item">
          <img class="song-cover" src="/api/cover/${encodeURIComponent(s.filename)}" alt="cover" onerror="this.src='data:image/svg+xml,<svg/>'">
          <div class="song-info">
            <div class="song-title">${s.title}</div>
            <div class="song-meta">${s.artist} — ${s.album}</div>
            <div class="song-meta" style="margin-top:2px;color:#555">${s.filename} · ${fmtSize(s.size)}</div>
          </div>
          <span class="duration">${fmtDuration(s.duration)}</span>
          <div class="song-actions">
            <a class="btn btn-sm" href="/api/stream/${encodeURIComponent(s.filename)}" download>⬇</a>
            <button class="btn btn-sm btn-danger" onclick="deleteSong('${s.filename}')">🗑</button>
          </div>
        </li>
      `).join('');
    }

    async function deleteSong(filename) {
      if (!confirm(`Xóa "${filename}"?`)) return;
      const res = await fetch(`/api/delete/${encodeURIComponent(filename)}`, { method: 'DELETE' });
      if (res.ok) { showToast(`Đã xóa ${filename}`); loadSongs(); }
      else showToast('Lỗi xóa file', true);
    }

    async function uploadFiles(files) {
      const form = new FormData();
      for (const f of files) form.append('files', f);

      const bar = document.getElementById('progressBar');
      const fill = document.getElementById('progressFill');
      bar.style.display = 'block';
      fill.style.width = '30%';

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        fill.style.width = '100%';
        const data = await res.json();
        showToast(`Upload thành công: ${data.uploaded.join(', ')}`);
        setTimeout(() => { bar.style.display = 'none'; fill.style.width = '0'; }, 500);
        loadSongs();
      } catch (e) {
        showToast('Lỗi upload', true);
        bar.style.display = 'none';
      }
    }

    // File input
    document.getElementById('fileInput').addEventListener('change', e => {
      if (e.target.files.length) uploadFiles(e.target.files);
    });

    // Drag and drop
    const zone = document.getElementById('dropZone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag');
      if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
    });

    // Get server IP
    fetch('/api/songs')
      .then(() => {
        document.getElementById('serverIp').textContent = window.location.host;
      });

    loadSongs();
  </script>
</body>
</html>
